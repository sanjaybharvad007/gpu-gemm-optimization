name: ci
on: [push, pull_request]

jobs:
  cpu:
    # Hosted runners have no GPU: lint + the analytical tools' tests, and every CUDA source is
    # type-checked with g++ through the host stub headers (catches the non-GPU class of errors).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install ruff pytest numpy matplotlib
      - run: ruff check .
      - run: pytest -q tests/python
      - name: type-check CUDA sources with the host stub
        run: bash tools/syntax_check.sh
      - name: device compile with NVRTC + ptxas (no GPU needed; reports registers / smem / spills)
        run: |
          pip install nvidia-cuda-nvrtc-cu12 nvidia-cuda-nvcc-cu12 nvidia-cuda-runtime-cu12 nvidia-cuda-cccl-cu12
          python tools/nvrtc_compile.py --arch sm_80
          python tools/nvrtc_compile.py --arch sm_90
      - name: roofline / tile model smoke run
        run: |
          python tools/occupancy.py --threads 256 --regs 128 --smem 56832 --arch sm80
          python tools/tile_model.py --bm 128 --bn 128 --bk 32 --threads 256 --dtype f16 --stages 3 --pad 8
          python tools/roofline.py results/sample_bench.csv --device "A100-SXM4-80GB" --out /tmp/roofline.png
          python tools/report.py results/sample_bench.csv
  cmake-configure:
    # Verifies the build system itself (CUDA toolkit without a GPU is enough to compile).
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends cmake git
      - run: cmake -S . -B build -DCMAKE_CUDA_ARCHITECTURES=80 -DGEMM_PTXAS_VERBOSE=ON
      - run: cmake --build build -j 2 2>&1 | tee build.log
      - name: ptxas register / smem report
        run: grep -E "Function properties|Used [0-9]+ registers" build.log | head -60 || true
